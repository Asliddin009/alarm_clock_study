name: alearn
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.1.0

  # Alarms & notifications
  alarm: ^5.5.0
  # System-level alarms on iOS 26+. Pinned exactly: the plugin is pre-1.0 and
  # its API still breaks between minor versions.
  flutter_alarmkit: 0.4.0
  awesome_notifications: ^0.12.1
  flutter_ringtone_player: ^4.0.0+4
  permission_handler: ^12.0.3

  # Storage
  shared_preferences: ^2.5.5

  # Media
  audioplayers: ^6.8.1
  lottie: ^3.5.1

  # UI
  numberpicker: ^2.1.2
  cupertino_icons: ^1.0.9

  # Utils
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/music/mozart.mp3
    - assets/music/nokia.mp3
    - assets/music/one_piece.mp3
    - assets/music/star_wars.mp3
    - assets/music/marimba.mp3
    # AlarmKit only accepts .caf/.aiff/.wav under 30s, so every ringtone ships
    # in both formats: .mp3 for the `alarm` package, .caf for AlarmKit.
    - assets/music/mozart.caf
    - assets/music/nokia.caf
    - assets/music/one_piece.caf
    - assets/music/star_wars.caf
    - assets/music/marimba.caf
    - assets/json/categories.json
    - assets/images/logo.jpg
    - assets/lottie/splash_pulse.json
    - assets/lottie/onboarding_alarm.json
    - assets/lottie/onboarding_words.json
    - assets/lottie/onboarding_voice.json
